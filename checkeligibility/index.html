<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #C0110A;
    --red-bright: #E01A10;
    --red-deep: #7A0804;
    --black: #050404;
    --surface: #0D0808;
    --surface2: #140A0A;
    --text: #F0E8E8;
    --text-muted: #8A6A6A;
    --border: rgba(192,17,10,0.25);
    --green: #3FBF6A;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 2.5rem;
    background: rgba(5,4,4,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--border);
  }

  .nav-logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    color: var(--red-bright);
    text-decoration: none;
  }

  .nav-cta { display: flex; gap: 0.75rem; align-items: center; }

  .btn-outline {
    padding: 0.5rem 1.2rem;
    border: 1px solid var(--red);
    color: var(--red-bright);
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .btn-outline:hover { background: var(--red); color: var(--text); }

  .btn-solid {
    padding: 0.5rem 1.4rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-solid:hover { background: var(--red-bright); }

  /* Mobile icon-only nav buttons — hidden on desktop, mirrors the homepage nav */
  .nav-icon-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(192,17,10,0.06);
    color: var(--text-muted);
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
    flex-shrink: 0;
  }
  .nav-icon-btn:hover { border-color: var(--red); color: var(--red-bright); background: rgba(192,17,10,0.14); }
  .nav-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

  main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    text-align: center;
    padding: 8rem 1.5rem 4rem;
  }

  .bg-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 60% at 50% 40%, rgba(120,8,4,0.35) 0%, transparent 70%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 640px;
    width: 100%;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--red-bright);
    margin-bottom: 1rem;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: clamp(2rem, 5vw, 3rem);
    margin-bottom: 1.2rem;
  }

  .sub {
    color: var(--text-muted);
    font-size: 0.95rem;
    max-width: 460px;
    margin: 0 auto 2.5rem;
  }

  .card {
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 2rem;
    text-align: left;
  }

  label {
    display: block;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.6rem;
  }

  .input-row {
    display: flex;
    align-items: stretch;
    gap: 0.75rem;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.9rem 1rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    line-height: 1.2;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]::placeholder { color: #5c4747; }
  input[type="text"]:focus { border-color: var(--red-bright); }

  .check-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.55rem;
    background: var(--red);
    border: 1px solid var(--red);
    color: #fff;
    padding: 0.9rem 1.6rem;
    line-height: 1.2;
    font-family: 'Inter', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }
  .check-btn:hover:not(:disabled) { background: var(--red-bright); }
  .check-btn:disabled { opacity: 0.85; cursor: default; }

  /* Spinner shown inside the button while the check is running */
  .btn-spinner {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    display: none;
    flex-shrink: 0;
  }
  .check-btn.loading .btn-spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .msg {
    margin-top: 1rem;
    font-size: 0.85rem;
    padding: 0.85rem 1rem;
    display: none;
    border: 1px solid transparent;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .msg.show {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }
  .msg.error {
    color: #FF8A82;
    border-color: rgba(224,26,16,0.4);
    background: rgba(192,17,10,0.08);
  }
  .msg.success {
    color: #C9F5D8;
    border-color: rgba(63,191,106,0.4);
    background: rgba(63,191,106,0.08);
  }
  .msg.neutral {
    color: var(--text-muted);
    border-color: var(--border);
    background: rgba(192,17,10,0.06);
  }

  .phase-tag {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.08em;
    font-size: 1.1rem;
    margin-bottom: 0.3rem;
  }

  .phase-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.4rem;
  }

  .phase-chip {
    display: inline-block;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.08em;
    font-size: 0.9rem;
    padding: 0.2rem 0.7rem;
    border: 1px solid rgba(63,191,106,0.5);
    background: rgba(63,191,106,0.1);
    color: #C9F5D8;
  }

  footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 1.5rem;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  footer a { color: var(--red-bright); text-decoration: none; }

  @media (max-width: 520px) {
    .input-row { flex-direction: column; }
    .check-btn { width: 100%; }
    nav { padding: 1rem 1.2rem; }
  }

  /* Mirrors the homepage's mobile nav: icon-only Discord/X buttons, luxury minimal treatment */
  @media (max-width: 720px) {
    .nav-cta .btn-outline,
    .nav-cta .btn-solid { display: none; }
    .nav-icon-btn { display: flex; }
    .nav-cta { gap: 0.5rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">PRIMALS</a>
  <div class="nav-cta">
    <!-- Desktop text buttons -->
    <a href="https://discord.gg/ZRrWFfRVez" target="_blank" class="btn-outline">Discord</a>
    <a href="https://x.com/primalsnftx" target="_blank" class="btn-solid">Follow on X</a>
    <!-- Mobile icon buttons -->
    <a href="https://discord.gg/ZRrWFfRVez" target="_blank" class="nav-icon-btn" aria-label="Discord">

<main>
  <div class="bg-glow"></div>
  <div class="wrap">
    <p class="eyebrow">Mint Eligibility</p>
    <h1>Check Your Wallet</h1>
    <p class="sub">Paste your Solana wallet address to see which phase you're eligible to mint in.</p>

    <div class="card">
      <label for="wallet">Wallet Address</label>
      <div class="input-row">
        <input type="text" id="wallet" placeholder="Paste your Solana address..." autocomplete="off" spellcheck="false" />
        <button class="check-btn" id="checkBtn">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-label">Check</span>
        </button>
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</main>

<footer>
  &copy; PRIMALS NFT — <a href="/">Back to home</a>
</footer>

<script>
(function () {
  const input = document.getElementById('wallet');
  const btn = document.getElementById('checkBtn');
  const btnLabel = btn.querySelector('.btn-label');
  const msg = document.getElementById('msg');

  // Base58, 32-44 chars — standard Solana address shape (excludes 0, O, I, l).
  const SOLANA_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;

  const FILES = {
    OG: 'og.csv',
    WL: 'wl.csv',
    WL2: 'wl2.csv'
  };

  let lists = null; // { OG: Set, WL: Set, WL2: Set }
  let loadError = false;

  // Minimum time the loading state stays visible, so a fast cache hit
  // still reads as a deliberate check rather than an instant flicker.
  const MIN_CHECK_MS = 550;

  function parseCsv(text) {
    return text
      .split(/\r?\n/)
      .map(line => line.split(',')[0].trim().replace(/^"|"$/g, ''))
      .filter(addr => addr && addr.toLowerCase() !== 'wallet' && addr.toLowerCase() !== 'address' && addr.toLowerCase() !== 'wallet address');
  }

  async function loadLists() {
    try {
      const entries = await Promise.all(
        Object.entries(FILES).map(async ([phase, file]) => {
          const res = await fetch(file, { cache: 'no-store' });
          if (!res.ok) throw new Error(file + ' failed to load');
          const text = await res.text();
          return [phase, new Set(parseCsv(text))];
        })
      );
      lists = Object.fromEntries(entries);
    } catch (e) {
      loadError = true;
    }
  }

  function hideMsg() {
    msg.classList.remove('show');
  }

  function showMsg(text, type) {
    msg.textContent = '';
    msg.className = 'msg ' + type;
    msg.textContent = text;
    // reflow so the fade-in transition replays every time, even for the same type
    void msg.offsetWidth;
    msg.classList.add('show');
  }

  function showPhaseMsg(label, text, type) {
    msg.className = 'msg ' + type;
    msg.innerHTML = '<span class="phase-tag">' + label + '</span><br>' + text;
    void msg.offsetWidth;
    msg.classList.add('show');
  }

  function showMultiPhaseMsg(labels, text, type) {
    const chips = labels.map(l => '<span class="phase-chip">' + l + '</span>').join('');
    msg.className = 'msg ' + type;
    msg.innerHTML = '<div class="phase-tags">' + chips + '</div>' + text;
    void msg.offsetWidth;
    msg.classList.add('show');
  }

  function isSolanaAddress(addr) {
    return SOLANA_RE.test(addr);
  }

  function setLoading(isLoading) {
    btn.disabled = isLoading;
    btn.classList.toggle('loading', isLoading);
    btnLabel.textContent = isLoading ? 'Checking...' : 'Check';
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function handleCheck() {
    const addr = input.value.trim();

    if (!addr) {
      showMsg('Paste a wallet address to check.', 'error');
      return;
    }

    if (!isSolanaAddress(addr)) {
      showMsg("That doesn't look like a valid Solana wallet address. Double-check and try again.", 'error');
      return;
    }

    hideMsg();
    setLoading(true);
    const startedAt = Date.now();

    if (!lists && !loadError) {
      await loadLists();
    }

    // Keep the spinner up for at least MIN_CHECK_MS so the result
    // always lands as a distinct, readable moment.
    const elapsed = Date.now() - startedAt;
    if (elapsed < MIN_CHECK_MS) {
      await wait(MIN_CHECK_MS - elapsed);
    }

    setLoading(false);

    if (loadError || !lists) {
      showMsg('Could not load eligibility data. Please refresh or try again shortly.', 'error');
      return;
    }

    const matched = [];
    if (lists.OG.has(addr)) matched.push('OG');
    if (lists.WL.has(addr)) matched.push('WL');
    if (lists.WL2.has(addr)) matched.push('WL2');

    if (matched.length === 0) {
      showPhaseMsg('PUBLIC PHASE', "This wallet isn't on an allowlist. You'll be able to mint during the Public phase.", 'neutral');
    } else if (matched.length === 1) {
      const phase = matched[0];
      showPhaseMsg(phase + ' PHASE', "You're eligible to mint in the " + phase + " phase.", 'success');
    } else {
      const nice = matched.join(', ').replace(/, ([^,]*)$/, ' & $1');
      showMultiPhaseMsg(
        matched.map(p => p + ' PHASE'),
        "You're eligible to mint in the " + nice + " phases.",
        'success'
      );
    }
  }

  btn.addEventListener('click', handleCheck);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleCheck();
  });

  // Warm the lists in the background so the first check feels instant.
  loadLists();
})();
</script>

</body>
